version: '3.8'

services:
  ad-site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_EQUESTRIAN_SERVICE_KEY: ${NEXT_PUBLIC_EQUESTRIAN_SERVICE_KEY}
    container_name: ad-site
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXT_PUBLIC_EQUESTRIAN_SERVICE_KEY=${NEXT_PUBLIC_EQUESTRIAN_SERVICE_KEY}
      - PORT=3000
      - NEXTJS_PORT=3001
    restart: unless-stopped
    env_file:
      - .env
