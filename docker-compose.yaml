version: '3.8'

services:
  ad-site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        EQUESTRIAN_SERVICE_KEY: ${EQUESTRIAN_SERVICE_KEY}
    container_name: ad-site
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - EQUESTRIAN_SERVICE_KEY=${EQUESTRIAN_SERVICE_KEY}
      - PORT=${PORT:-3000}
    restart: unless-stopped
    env_file:
      - .env
